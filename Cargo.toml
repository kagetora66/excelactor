[package]
name = "excelactor"
version = "0.1.0"
edition = "2024"
description = "Batch extracting data from many excel files based on input keyword"
readme = "README.md"

[[bin]]
name = "excelactor"
path = "src/main.rs"

[dependencies]
umya-spreadsheet = "2.3.1"
regex = "1.11.1"
csv = "1.3.1"
rfd = "0.11"
anyhow = "1.0"
walkdir = "2.4"
